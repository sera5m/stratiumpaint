<!doctype html>
<meta charset="utf-8">
<title>running</title>
<!-- Run by npm run test:gpu. The 3D view's Projection shape mode end to end: a rectangle dragged
     over two stacked planes from the camera and from above (Down), on WebGL (CPU projection) and on
     WebGPU (GPU projection): decal preview while dragging, paint only on the first surface hit,
     hidden objects skipped, one history step, exact undo. -->
<style>#pane { position: relative; width: 400px; height: 400px; } #pane canvas { position: absolute; inset: 0; width: 100%; height: 100%; }</style>
<div id="pane"></div>
<pre id="out"></pre>
<script>
const bail = (m) => { document.getElementById('out').textContent += '\nERROR ' + m; document.title = 'FAIL'; };
addEventListener('error', (e) => bail(e.message + ' ' + (e.error?.stack || '')));
addEventListener('unhandledrejection', (e) => bail(String(e.reason?.stack || e.reason)));
</script>
<script type="module">
import { Editor } from '../../src/js/ui/editor.js';
import { Doc } from '../../src/js/doc/document.js';
import { MeshView } from '../../src/js/ui/meshview.js';
import { getGPU } from '../../src/js/gpu/device.js';
import { GpuCompositor } from '../../src/js/gpu/compositor.js';

const out = [], fails = [];
const log = (s) => { out.push(s); document.getElementById('out').textContent = out.join('\n'); };
const frame = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
const quad = (y, s, u0, v0, u1, v1) => ({ p: [[-s, y, -s], [s, y, -s], [s, y, s], [-s, y, s]], uv: [[u0, v0], [u1, v0], [u1, v1], [u0, v1]] });
function mesh(quads) {
  const pos = [], idx = [], uvs = [], groups = [];
  quads.forEach((q, gi) => {
    const base = pos.length / 3, start = idx.length / 3;
    for (const p of q.p) pos.push(...p);
    for (const [a, b, c] of [[0, 1, 2], [0, 2, 3]]) { idx.push(base + a, base + b, base + c); uvs.push(...q.uv[a], ...q.uv[b], ...q.uv[c]); }
    groups.push({ name: gi ? 'floor' : 'lid', start, count: 2 });
  });
  return { positions: new Float32Array(pos), indices: new Uint32Array(idx), uvs: new Float32Array(uvs), groups };
}
const W = 256, H = 256;
const ed = new Editor(), doc = new Doc(W, H);
doc.layers[0].img.data.fill(255); doc.layers[0].touch();
// lid: y = 0.5, [-0.5,0.5]², top-left quarter of the texture; floor: y = 0, [-1,1]², bottom-right quarter
doc.mount = mesh([quad(0.5, 0.5, 0, 0, 0.5, 0.5), quad(0, 1, 0.5, 0.5, 1, 1)]);
ed.addDoc(doc);
const mv = new MeshView(ed, document.getElementById('pane'));
mv.canvas.setPointerCapture = () => {}; // synthetic pointers have no capture
await frame();
mv.yaw = 0; mv.pitch = 1.3; await frame();
ed.setTool('rect');
ed.setOpt('shape', 'fill');
ed.setOpt('shape3d', 'projection');
if (ed.opts.wrapShapes !== true) fails.push('switching to Projection changed Wrap seams');
ed.setOpt('shape3d', 'chart');
if (ed.opts.wrapShapes !== false) fails.push('Surface (per chart) did not turn Wrap seams off');
ed.setOpt('wrapShapes', true);
if (ed.opts.shape3d !== 'wrap') fails.push('Wrap seams on did not select Surface (wrap seams)');
ed.setOpt('shape3d', 'projection');
ed.primary = { r: 230, g: 20, b: 20, a: 1 };

const px = (x, y) => { const d = doc.layers[0].img.data, i = (y * W + x) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; };
const red = (p) => p[0] > 200 && p[1] < 60;
const white = (p) => p[0] === 255 && p[1] === 255 && p[2] === 255;
const R = () => mv.canvas.getBoundingClientRect();
const fire = (type, x, y, o = {}) => mv.canvas.dispatchEvent(new PointerEvent(type, { clientX: R().left + x, clientY: R().top + y, button: 0, pointerId: 1, bubbles: true, ...o }));
const wait = (ms) => new Promise((res) => setTimeout(res, ms));
function centreColour() {
  const gl = mv.gl, p = new Uint8Array(4);
  gl.readPixels(gl.drawingBufferWidth >> 1, gl.drawingBufferHeight >> 1, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, p);
  return [...p];
}
async function gpuCentre() {
  const t = mv._gpuTarget, dev = ed.gpuCompositor.device;
  const buf = dev.createBuffer({ size: 256, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const enc = dev.createCommandEncoder();
  enc.copyTextureToBuffer({ texture: t, origin: [t.width >> 1, t.height >> 1] }, { buffer: buf, bytesPerRow: 256 }, [1, 1]);
  dev.queue.submit([enc.finish()]);
  await buf.mapAsync(GPUMapMode.READ);
  const p = [...new Uint8Array(buf.getMappedRange()).slice(0, 4)];
  buf.unmap(); buf.destroy();
  return t.format.startsWith('bgra') ? [p[2], p[1], p[0], p[3]] : p;
}
const lid = (x, z) => [Math.floor((x + 0.5) * 0.5 * W), Math.floor((z + 0.5) * 0.5 * H)];
const floor = (x, z) => [Math.floor((0.5 + (x + 1) * 0.25) * W), Math.floor((0.5 + (z + 1) * 0.25) * H)];

// 1. Place the projector: a click on the model (the lid, seen from above).
{
  const h0 = doc.history.index;
  fire('pointerdown', 200, 200); fire('pointerup', 200, 200); await frame();
  const L = ed.opts.projLoc;
  log(`placed at ${JSON.stringify(L)}, rotation ${JSON.stringify(ed.opts.projRot)} (${ed.opts.projectFrom})`);
  if (!L || Math.abs(L[1] - 0.5) > 1e-3 || Math.hypot(L[0], L[2]) > 0.2) fails.push(`projector not placed on the lid under the cursor: ${L}`);
  if (doc.history.index !== h0) fails.push('placing the projector touched the history');
  if (!mv.gizmo) fails.push('no gizmo while Projection mode is active');
  if (!(mv.gizmoStats.drawn > 0)) fails.push('gizmo never drawn');
}

/** Drag the shape over most of the view; returns facts about it. */
async function round(label) {
  const before = new Uint8ClampedArray(doc.layers[0].img.data), h0 = doc.history.index;
  mv.lastProjection = null;
  fire('pointerdown', 20, 20);
  for (let k = 1; k <= 4; k++) fire('pointermove', 20 + 90 * k, 20 + 90 * k);
  await frame();
  const decalSeen = !!mv.decal;
  const c = mv.backend === 'webgpu' ? await gpuCentre() : centreColour();
  if (!(c[0] > 110 && c[1] < 40)) fails.push(`${label}: decal preview not visible at the centre (${c})`); // shaded red, light ≥ 0.62
  fire('pointerup', 380, 380);
  for (let i = 0; i < 300 && !mv.lastProjection; i++) await wait(10);
  await frame();
  const lp = mv.lastProjection || {};
  log(`${label}: ${lp.backend} ${lp.ms?.toFixed(1)} ms, rect ${JSON.stringify(lp.rect)}, history +${doc.history.index - h0}`);
  if (!decalSeen) fails.push(`${label}: no decal while dragging`);
  if (mv.decal) fails.push(`${label}: decal left after release`);
  if (doc.history.index - h0 !== 1) fails.push(`${label}: ${doc.history.index - h0} history steps`);
  return { before, lp };
}
async function checks(label, expectBackend, { openFloor = true } = {}) {
  const { before, lp } = await round(label);
  if (lp.backend !== expectBackend) fails.push(`${label}: projected on ${lp.backend}, expected ${expectBackend}`);
  if (!red(px(...lid(0, 0)))) fails.push(`${label}: lid centre not painted ${px(...lid(0, 0))}`);
  if (!white(px(...floor(0, 0)))) fails.push(`${label}: floor under the lid painted ${px(...floor(0, 0))}`);
  if (openFloor && !red(px(...floor(0.8, 0.8)))) fails.push(`${label}: open floor not painted ${px(...floor(0.8, 0.8))}`);
  doc.undo();
  const now = doc.layers[0].img.data;
  let diff = 0; for (let i = 0; i < now.length; i++) if (now[i] !== before[i]) diff++;
  if (diff) fails.push(`${label}: undo left ${diff} bytes changed`);
}
async function allRounds(tag, backend) {
  ed.setOpt('projectFrom', 'down'); ed.setOpt('projSource', 'parallel'); ed.setOpt('projPoints', 1);
  await checks(`${tag}, Down, parallel`, backend);
  ed.setOpt('projectFrom', 'view');
  if (ed.opts.projectFrom === 'view') fails.push('View preset did not resolve to a rotation');
  await checks(`${tag}, aligned to view, parallel`, backend);
  ed.setOpt('projectFrom', 'down'); ed.setOpt('projSource', 'point'); ed.setOpt('projDist', 150);
  await checks(`${tag}, Down, point`, backend);
  ed.setOpt('projSource', 'parallel'); ed.setOpt('projPoints', 4); ed.setOpt('projSpread', 25);
  await checks(`${tag}, Down, 4 points 25°`, backend);
  ed.setOpt('projPoints', 1);
}

await allRounds('WebGL', 'cpu');
// hidden lid: neither painted nor in the way
mv.selectedGroup = 0; document.querySelector('.obj-hide').click(); await frame();
{
  ed.setOpt('projectFrom', 'down');
  await round('WebGL, lid hidden');
  if (!white(px(...lid(0, 0)))) fails.push('hidden lid got paint');
  if (!red(px(...floor(0, 0)))) fails.push('floor under the hidden lid not painted');
  doc.undo();
}
document.querySelector('.obj-hide').click(); await frame();

// 2. Gizmo: drag the X arrow (Shift snaps), then the ring of the rotation that faces the camera.
{
  const g = mv.gizmo, L0 = ed.opts.projLoc.slice();
  const ar = g.arrows.find((a) => a.k === 0);
  const mid = [(ar.a[0] + ar.b[0]) / 2, (ar.a[1] + ar.b[1]) / 2], dx = ar.b[0] - ar.a[0], dy = ar.b[1] - ar.a[1];
  fire('pointerdown', ...mid);
  fire('pointermove', mid[0] + dx * 0.5, mid[1] + dy * 0.5, { shiftKey: true });
  fire('pointerup', mid[0] + dx * 0.5, mid[1] + dy * 0.5);
  const L1 = ed.opts.projLoc;
  log(`X arrow drag: ${JSON.stringify(L0)} → ${JSON.stringify(L1)}`);
  if (!(L1[0] > L0[0]) || Math.abs(L1[1] - L0[1]) > 1e-9 || Math.abs(L1[2] - L0[2]) > 1e-9) fails.push('X arrow drag did not move along X only');
  if (Math.abs(L1[0] * 10 - Math.round(L1[0] * 10)) > 1e-6) fails.push(`Shift did not snap X to 0.1 (${L1[0]})`);
  ed.setOpt('projLoc', L0);
  // rings: the one most face-on is the Z… from above the world Y axis faces us: ring k = 1 for Down (gimbal)
  const g2 = mv.gizmo;
  const ring = g2.rings.map((r) => ({ r, spread: Math.max(...r.pts.map((p) => p[0])) - Math.min(...r.pts.map((p) => p[0])) + Math.max(...r.pts.map((p) => p[1])) - Math.min(...r.pts.map((p) => p[1])) }))
    .sort((a, b) => b.spread - a.spread)[0].r;
  // grab it where no other ring passes (edge-on rings cross it)
  const others = g2.rings.filter((r) => r !== ring).flatMap((r) => r.pts);
  const p0 = ring.pts.map((p) => ({ p, d: Math.min(...others.map((q) => Math.hypot(q[0] - p[0], q[1] - p[1]))) })).sort((a, b) => b.d - a.d)[0].p, c = g2.centre;
  const r0 = ed.opts.projRot.slice();
  fire('pointerdown', ...p0);
  const ang = Math.atan2(p0[1] - c[1], p0[0] - c[0]) + 0.8, rad = Math.hypot(p0[0] - c[0], p0[1] - c[1]);
  fire('pointermove', c[0] + Math.cos(ang) * rad, c[1] + Math.sin(ang) * rad, { shiftKey: true });
  fire('pointerup', c[0] + Math.cos(ang) * rad, c[1] + Math.sin(ang) * rad);
  const r1 = ed.opts.projRot;
  log(`ring ${'XYZ'[ring.k]} drag (Shift): ${JSON.stringify(r0)} → ${JSON.stringify(r1)} (${ed.opts.projectFrom})`);
  const changed = r1.map((v, i) => Math.abs(v - r0[i]) > 1e-9);
  if (!changed[ring.k] || changed.filter(Boolean).length !== 1) fails.push('ring drag did not turn exactly its own angle');
  if (Math.abs(Math.abs(r1[ring.k] - r0[ring.k]) - 45) > 1e-6) fails.push(`ring drag of ≈46° did not snap to 45° (${r1[ring.k] - r0[ring.k]})`);
  if (ed.opts.projectFrom !== 'custom') fails.push('turned projector still shows a preset');
  ed.setOpt('projectFrom', 'down');
}

const gpu = await getGPU().catch(() => null);
if (!gpu) log('WebGPU: skipped');
else {
  const comp = new GpuCompositor(gpu, document.createElement('canvas'));
  mv._gpuTarget = gpu.device.createTexture({ size: [mv.canvas.width, mv.canvas.height], format: gpu.format, usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC });
  ed.gpuCompositor = comp; ed.emit('renderer', 'webgpu'); await frame();
  if (mv.backend !== 'webgpu') fails.push(`3D backend ${mv.backend}`);
  await allRounds('WebGPU', 'webgpu');
  ed.gpuCompositor = null; ed.emit('renderer', 'canvas'); await frame();
}
// existing modes untouched: a surface-mode drag still goes through the tool (one step, chart paint)
ed.setOpt('shape3d', 'wrap');
{
  const h0 = doc.history.index;
  const r = mv.canvas.getBoundingClientRect();
  const fire = (type, x, y) => mv.canvas.dispatchEvent(new PointerEvent(type, { clientX: r.left + x, clientY: r.top + y, button: 0, pointerId: 1, bubbles: true }));
  fire('pointerdown', 190, 190); fire('pointermove', 205, 205); fire('pointermove', 215, 215); fire('pointerup', 215, 215);
  await frame();
  log(`surface mode: history +${doc.history.index - h0}`);
  if (doc.history.index - h0 !== 1) fails.push('surface mode drag did not commit one step');
  if (mv.lastProjection && mv.lastProjection.rect === undefined) fails.push('surface mode ran a projection');
}
document.title = fails.length ? 'FAIL' : 'PASS';
log(fails.length ? fails.join('\n') : 'projection mode in the 3D view: PASS');
</script>
